name: build

# Builds the Windows x64 plugin on a clean runner so a verified DLL is produced
# on every push, and attaches it to the GitHub release on a v* tag.
on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x64 (Release)
    runs-on: windows-latest
    env:
      # csurf.h pulls "WDL/db2val.h" / "WDL/wdlstring.h" and csurf_01X/csurf_mcu
      # pull "WDL/ptrlist.h" — unguarded, include-path-style — so they resolve via
      # $(REAPER_EXTENSION_SDK). WDL is gitignored (not vendored), so we fetch it and
      # point the variable at the directory that *contains* the WDL/ folder. This
      # mirrors the local convention (REAPER_EXTENSION_SDK -> C:\reaper_extension_sdk\,
      # which bundles WDL/). No swell.h or sdk/ headers are needed on Windows.
      REAPER_EXTENSION_SDK: ${{ github.workspace }}\external-wdl

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch WDL headers (not vendored; provides WDL/* used on Windows)
        shell: bash
        run: git clone --depth 1 https://github.com/justinfrankel/WDL.git external-wdl

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      # Release|x64 of the VS2019 solution — the same config that produces the
      # working local DLL. PostBuildEventUseInBuild=false skips the project's
      # post-build step (it copies into %APPDATA%\REAPER\UserPlugins\, which does
      # not exist on a runner); the build configuration itself is untouched.
      - name: Build (Release|x64)
        shell: cmd
        run: msbuild Builds\VisualStudio2019\reaper_csurf.sln /p:Configuration=Release /p:Platform=x64 /p:PostBuildEventUseInBuild=false /m /v:minimal

      - name: Stage DLL under the release asset name
        shell: bash
        run: |
          dll=$(find Builds/VisualStudio2019 -path '*Release*' -name 'reaper_csurf_x64.dll' | head -1)
          test -n "$dll" || { echo "::error::built DLL not found under Builds/VisualStudio2019"; exit 1; }
          mkdir -p dist
          cp "$dll" dist/reaper_csurf_dm2000_x64.dll
          echo "staged $dll -> dist/reaper_csurf_dm2000_x64.dll"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: reaper_csurf_dm2000_x64
          path: dist/reaper_csurf_dm2000_x64.dll
          if-no-files-found: error

  release:
    name: Attach DLL to GitHub + GitLab releases
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: reaper_csurf_dm2000_x64
          path: dist

      - name: Name the asset with the tag
        run: mv dist/reaper_csurf_dm2000_x64.dll "dist/reaper_csurf_dm2000_x64-${{ github.ref_name }}.dll"

      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/reaper_csurf_dm2000_x64-${{ github.ref_name }}.dll
          fail_on_unmatched_files: true

      # Mirror the same DLL onto the GitLab release: PUT to the generic package
      # registry, then add it as a release asset link - creating the release if the
      # tag has none yet, and leaving notes untouched on one that already exists.
      # Uses the GITLAB_TOKEN secret (a GitLab PAT with api scope).
      - name: Attach to the GitLab release
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"                          # v1.0 -> 1.0 (matches existing package versions)
          FILE="reaper_csurf_dm2000_x64-${TAG}.dll"
          BASE="https://git.pg.edu.pl/api/v4/projects/5488"
          PKG="${BASE}/packages/generic/reaper_csurf_dm2000/${VER}/${FILE}"

          echo "Uploading ${FILE} to the GitLab package registry..."
          curl -sf --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" --upload-file "dist/${FILE}" "${PKG}"; echo

          code=$(curl -s -o /dev/null -w '%{http_code}' --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "${BASE}/releases/${TAG}")
          if [ "${code}" = "404" ]; then
            echo "GitLab release ${TAG} missing - creating it with the DLL asset"
            curl -sf --request POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"assets\":{\"links\":[{\"name\":\"${FILE}\",\"url\":\"${PKG}\",\"link_type\":\"package\"}]}}" \
              "${BASE}/releases" >/dev/null
          else
            echo "GitLab release ${TAG} exists - adding the DLL asset link"
            curl -s --request POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              --data "name=${FILE}" --data-urlencode "url=${PKG}" --data "link_type=package" \
              "${BASE}/releases/${TAG}/assets/links" >/dev/null || true
          fi
          echo "GitLab release ${TAG} now carries ${FILE}"
